<!doctype html>
<!--
  Served by Azure SWA via responseOverrides.404 in staticwebapp.config.json.

  Note this fires for ANY unmatched request, not just page loads — a missing
  hashed asset (e.g. a stale index.html requesting a chunk from a prior build)
  also gets this HTML body. That is safe only because the override sets
  statusCode: 404: the browser treats the response as a failed load rather than
  handing HTML to the script or stylesheet parser. If you ever change that
  status to 200, you reintroduce MIME-confusion on asset requests.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>Page not found · sessionr</title>
    <style>
      /* Mirrors the token block in src/index.css so this standalone page
         matches the app in both colour schemes. */
      :root {
        color-scheme: dark;
        --bg: #121212;
        --surface: #1e1e1e;
        --surface-2: #2a2a2a;
        --text: #ffffff;
        --muted: #9e9e9e;
        --accent: #4dd0a5;
        --border: #3a3a3a;
      }

      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f5f4f2;
          --surface: #ffffff;
          --surface-2: #eceae7;
          --text: #1a1a1a;
          --muted: #62605c;
          --accent: #0e8f6f;
          --border: #d8d5d0;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      .card {
        background: var(--surface);
        border-radius: 8px;
        padding: 2rem 1.5rem;
        text-align: center;
        width: 100%;
        max-width: 32rem;
      }

      .logo {
        width: 96px;
        height: auto;
        opacity: 0.85;
      }

      .code {
        margin: 0.5rem 0 0;
        font-size: 4rem;
        line-height: 1;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      h1 {
        margin: 0.5rem 0 0.75rem;
        font-size: 1.4rem;
      }

      p.meta {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }

      .btn {
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.45rem 0.8rem;
        font-size: 0.95rem;
        font-family: inherit;
        text-decoration: none;
        cursor: pointer;
      }

      .btn.primary {
        border-color: var(--accent);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/logo-transparent-bordered.png" alt="" />
      <p class="code">404</p>
      <h1>That tune isn't in the book</h1>
      <p class="meta">
        We couldn't find anything at this address. The link may be out of date, or the file may have moved.
      </p>
      <div class="actions">
        <a class="btn primary" href="/">Go Home</a>
        <button class="btn" type="button" onclick="history.back()">Go Back</button>
      </div>
    </div>
  </body>
</html>
